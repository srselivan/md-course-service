image:
  repository: srselivan/users-service
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

config:
  logFilePath: /app/logs
  httpServerAddr: ":8080"

  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql.postgres.svc.cluster.local:5432/users"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "app-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  API_FILE_SERVICE_BASE_URL: "http://file-app:8087"
  JAVA_OPTS: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=35 -XX:+UseG1GC -XX:MaxMetaspaceSize=256m"

# Секреты. В проде укажи existingSecret и не храни значения здесь.
secrets:
  existingSecret: ""
  data:
    SPRING_DATASOURCE_USERNAME: "postgres"
    SPRING_DATASOURCE_PASSWORD: "postgres"

extraEnv:
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "postgres"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgresql.postgres.svc.cluster.local:5432/users"
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "app-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  - name: API_FILE_SERVICE_BASE_URL
    value: "http://file-app:8087"
  - name: JAVA_OPTS
    value: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=35 -XX:+UseG1GC -XX:MaxMetaspaceSize=256m"

service:
  type: ClusterIP
  port: 10002
  targetPort: 8080

resources:
  requests:
    cpu: 50m       # 50 миллиCPU = 0.05 ядра
    memory: 256Mi
  limits:
    cpu: 500m      # 0.5 ядра
    memory: 512Mi

probes:
  startup:
    enabled: false
    failureThreshold: 30
    periodSeconds: 2

  liveness:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readiness:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

ingress:
  enabled: false
  # className — имя IngressClass (например, "nginx", "traefik").
  className: "nginx"
  annotations: {}
  # nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: users-service.local
      paths:
        - path: /
          pathType: Prefix
  tls: []