host: localhost:8080
info:
  contact: {}
  description: |-
    REST API for courses, sections, assignments, question banks and tests.
    Tests are also available under `/api` (same handlers as `/cs/v1`).
  title: Course Service API
  version: "1.0"
paths:
  /assignments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course-service_internal_domain.Assignment'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: List assignments
      tags:
      - assignments
    post:
      consumes:
      - application/json
      parameters:
      - description: Assignment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.CreateAssignment'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/course-service_internal_domain.Assignment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Create assignment
      tags:
      - assignments
  /assignments/{item_id}:
    delete:
      parameters:
      - description: Section item ID
        in: path
        name: item_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Delete assignment
      tags:
      - assignments
    get:
      parameters:
      - description: Section item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course-service_internal_domain.Assignment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Get assignment
      tags:
      - assignments
    put:
      consumes:
      - application/json
      parameters:
      - description: Section item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Assignment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.UpdateAssignment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course-service_internal_domain.Assignment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Update assignment
      tags:
      - assignments
  /attempts:
    get:
      parameters:
      - description: Filter by test ID
        in: query
        name: test_id
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course-service_internal_domain.TestAttempt'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: List attempts
      tags:
      - attempts
    post:
      consumes:
      - application/json
      parameters:
      - description: Questions page size
        in: query
        name: limit
        type: integer
      - description: Questions page offset
        in: query
        name: offset
        type: integer
      - description: Attempt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.StartAttempt'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/course-service_internal_domain.AttemptState'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Start test attempt
      tags:
      - attempts
  /attempts/{attempt_id}:
    get:
      parameters:
      - description: Attempt ID
        in: path
        name: attempt_id
        required: true
        type: integer
      - description: Questions page size
        in: query
        name: limit
        type: integer
      - description: Questions page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course-service_internal_domain.AttemptState'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Get attempt state
      tags:
      - attempts
  /attempts/{attempt_id}/answers:
    put:
      consumes:
      - application/json
      parameters:
      - description: Attempt ID
        in: path
        name: attempt_id
        required: true
        type: integer
      - description: Answer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.SaveAttemptAnswer'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Save attempt answer
      tags:
      - attempts
  /attempts/{attempt_id}/submit:
    post:
      parameters:
      - description: Attempt ID
        in: path
        name: attempt_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course-service_internal_domain.TestAttempt'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Submit attempt for grading
      tags:
      - attempts
  /bank_questions:
    get:
      parameters:
      - description: Bank ID
        in: query
        name: bank_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course-service_internal_domain.BankQuestion'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: List bank questions
      tags:
      - bank-questions
  /bank_questions/{id}/bulk:
    put:
      consumes:
      - application/json
      parameters:
      - description: Bank ID
        in: path
        name: id
        required: true
        type: integer
      - description: Questions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.BulkUpdateBankQuestion'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Replace all questions in a bank
      tags:
      - bank-questions
  /bank_questions/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: Questions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.BulkCreateBankQuestion'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Bulk create bank questions
      tags:
      - bank-questions
  /bank_questions/generate:
    post:
      responses:
        "200":
          description: OK
      summary: Generate bank questions (stub)
      tags:
      - bank-questions
  /banks:
    get:
      parameters:
      - description: Course ID
        in: query
        name: course_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course-service_internal_domain.Bank'
            type: array
        "400":
          description: Bad Request
          schema:
