    - COMPLETED
    - NEEDS_GRADING
    type: string
    x-enum-varnames:
    - TestAttemptStatusInProgress
    - TestAttemptStatusCompleted
    - TestAttemptStatusNeedsGrading
  course-service_internal_domain.TestGradeStatus:
    enum:
    - NONE
    - READY
    - PRE_GRADED
    type: string
    x-enum-varnames:
    - TestGradeStatusNone
    - TestGradeStatusReady
    - TestGradeStatusPreGraded
  course-service_internal_domain.TestWithAttempts:
    properties:
      attempts:
        items:
          $ref: '#/definitions/course-service_internal_domain.TestAttempt'
