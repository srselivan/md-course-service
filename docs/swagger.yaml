    type: object
  course-service_internal_domain.CourseWithItems:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      ownerUserId:
        type: integer
      sections:
        items:
          $ref: '#/definitions/course-service_internal_domain.CourseSectionWithItems'
        type: array
      stats:
        $ref: '#/definitions/course-service_internal_domain.CourseStats'
      status:
        type: integer
      title:
        type: string
      updatedAt:
