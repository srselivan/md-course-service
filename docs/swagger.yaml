  course-service_internal_domain.PublicQuestionAnswer:
    properties:
      id:
        type: integer
      question_id:
        type: integer
      text:
        type: string
    type: object
  course-service_internal_domain.Question:
    properties:
      answers:
        items:
          $ref: '#/definitions/course-service_internal_domain.QuestionAnswer'
        type: array
      bank_id:
        type: integer
      difficulty_level:
        type: integer
      id:
        type: integer
      points:
        type: integer
      text:
        type: string
      type:
        $ref: '#/definitions/course-service_internal_domain.TestingQuestionType'
