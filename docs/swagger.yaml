host: localhost:10001
info:
  contact: {}
  description: |-
    REST API for courses, sections, assignments, question banks and tests.
    Courses: list/stats use query `user_id` until JWT is enabled. Course status: 0 — Draft, 1 — Active.
    Cover image changes publish Kafka events on topic `file-topic` (FileLoadedEvent / FileDeletedEvent).
    Tests are also available under `/api` (same handlers as `/cs/v1`).
  title: Course Service API
  version: "1.0"
paths:
  /assignments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course-service_internal_domain.Assignment'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: List assignments
      tags:
      - assignments
    post:
      consumes:
      - application/json
      parameters:
      - description: Assignment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.CreateAssignment'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/course-service_internal_domain.Assignment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Create assignment
      tags:
      - assignments
  /assignments/{item_id}:
    delete:
      parameters:
      - description: Section item ID
        in: path
        name: item_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Delete assignment
      tags:
      - assignments
    get:
      parameters:
      - description: Section item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course-service_internal_domain.Assignment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Get assignment
      tags:
      - assignments
    put:
      consumes:
      - application/json
      parameters:
      - description: Section item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Assignment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.UpdateAssignment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course-service_internal_domain.Assignment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: Update assignment
      tags:
      - assignments
  /attempts:
    get:
      description: 'Lists attempts with optional filters. status values: IN_PROGRESS,
        COMPLETED, NEEDS_GRADING.'
      parameters:
      - description: Filter by test ID
        example: 10
        in: query
        name: test_id
        type: integer
      - description: Filter by user ID
        example: 42
        in: query
        name: user_id
        type: integer
      - description: Filter by status
        enum:
        - IN_PROGRESS
        - COMPLETED
        - NEEDS_GRADING
        example: IN_PROGRESS
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course-service_internal_domain.TestAttempt'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_v1.ErrorResponse'
      summary: List attempts
      tags:
      - attempts
    post:
      consumes:
      - application/json
      description: 'Starts a new attempt. Optional limit/offset paginate questions
        in the response. Body: {"testId":10,"userId":42}.'
      parameters:
      - description: Questions page size
        example: 10
        in: query
        name: limit
        type: integer
      - description: Questions page offset
        example: 0
        in: query
        name: offset
        type: integer
      - description: Attempt start payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/course-service_internal_transport_http_v1_request.StartAttempt'
