# Пример конфигурации кластера kind для Linux.
# Создание: kind create cluster --name course --config helm/course-service/kind-cluster.example.yaml
#
# extraHosts добавляет host.docker.internal в /etc/hosts нод kind.
# Это нужно, если Postgres слушает порт на ХОСТЕ (docker run -p 5432:5432),
# а не если вы подключили контейнер postgres к сети kind (тогда проще host: postgres).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: course
nodes:
  - role: control-plane
    extraHosts:
      # Замени IP, если 172.17.0.1 у тебя не работает:
      #   ip -4 addr show docker0
      - hostname: host.docker.internal
        ip: 172.17.0.1
