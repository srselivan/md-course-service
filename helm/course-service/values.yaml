# =============================================================================
# values.yaml — значения по умолчанию для Helm chart course-service.
# -----------------------------------------------------------------------------
# Этот файл описывает ВСЕ параметры, которые можно переопределить при установке
# чарта. Любое значение можно переопределить:
#   1) своим файлом: helm install ... -f values.prod.yaml
#   2) флагом --set: helm install ... --set image.tag=1.2.3
#
# В Helm работает порядок: values.yaml < -f my.yaml < --set ...
# Чем правее — тем выше приоритет.
# =============================================================================

# -----------------------------------------------------------------------------
# image — Docker-образ, который запускаем в Pod'е.
# -----------------------------------------------------------------------------
image:
  # repository — полный путь до образа в реестре БЕЗ тега.
  # Примеры:
  #   - локальный реестр в minikube/kind: course-service
  #   - Docker Hub:   docker.io/<user>/course-service
  #   - GHCR:         ghcr.io/<org>/course-service
  #   - GitLab:       registry.gitlab.com/<group>/<project>/course-service
  repository: course-service

  # tag — версия образа. Если оставить пустым (""), Helm подставит .Chart.AppVersion
  # из Chart.yaml (сейчас "1.0.0"). Лучше указывать конкретный тег, а не latest:
  # latest приводит к непредсказуемым обновлениям.
  tag: "latest"

  # pullPolicy — когда тянуть образ из реестра:
  #   IfNotPresent — тянуть только если в ноде ещё нет образа (быстрее).
  #   Always       — тянуть всегда (полезно для тегов вроде "main"/"latest").
  #   Never        — никогда не тянуть (нужно для локальной разработки в minikube,
  #                  когда образ собран локально в её docker-демоне).
  pullPolicy: IfNotPresent

# imagePullSecrets — список секретов с креденшелами приватного реестра.
# Создаётся отдельно командой:
#   kubectl create secret docker-registry regcred \
#       --docker-server=<server> --docker-username=<user> \
#       --docker-password=<pass> --docker-email=<email>
# Здесь указываем имя такого секрета. Если реестр публичный — оставляем пустым.
imagePullSecrets: []
# - name: regcred

# -----------------------------------------------------------------------------
# nameOverride / fullnameOverride — позволяют поменять имена ресурсов в k8s.
# По умолчанию имя берётся из Chart.Name + Release.Name.
# Менять обычно не нужно.
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# replicaCount — сколько копий (Pod'ов) приложения запускать.
# Для учебного стенда хватает 1. В проде обычно 2+ для отказоустойчивости.
# ВАЖНО: при replicaCount > 1 приложение должно корректно работать в нескольких
# экземплярах. Сейчас сервис запускает миграции на старте — при одновременном
# старте нескольких подов может быть гонка. Для учебного стенда это норм.
# -----------------------------------------------------------------------------
replicaCount: 1

# -----------------------------------------------------------------------------
# Стратегия обновления Deployment.
# RollingUpdate — k8s заменяет поды по одному (без даунтайма).
# Recreate      — сначала убивает все старые, потом запускает новые
#                 (есть короткий даунтайм, но проще).
# -----------------------------------------------------------------------------
strategy:
  type: RollingUpdate
  rollingUpdate:
    # Сколько подов сверх replicaCount можно временно поднять при выкате.
    maxSurge: 1
    # Сколько подов из replicaCount могут быть недоступны во время выката.
    maxUnavailable: 0

# -----------------------------------------------------------------------------
# config — несекретная конфигурация приложения.
# Из неё мы собираем содержимое .env файла (приложение читает .env при старте,
# см. internal/config/config.go).
# -----------------------------------------------------------------------------
config:
  # Уровень логирования: debug | info | warn | error
  logLevel: info

  # Папка, куда приложение пишет файл логов.
  # /app/logs — это путь внутри контейнера (создаётся в Dockerfile).
  # Туда монтируется emptyDir-том, см. deployment.yaml.
  logFilePath: /app/logs

  # На каком адресе слушать HTTP. Пустой host = 0.0.0.0 (все интерфейсы).
  # Порт ДОЛЖЕН совпадать с service.port и containerPort.
  httpServerAddr: ":10001"

  # ----- PostgreSQL (живёт ВНЕ Kubernetes) -----
  postgres:
    # host — адрес внешней БД. Это может быть:
    #   - DNS-имя:        db.example.com
    #   - IP узла:        10.0.5.12
    #   - Если PG крутится прямо на той же машине, что и k8s-нода (например,
    #     в Docker Desktop / Rancher Desktop), используем имя:
    #         host.docker.internal  (Docker Desktop)
    #         host.minikube.internal (minikube — нужно включить)
    host: "host.docker.internal"
    port: "5432"
    user: "postgres"
    # password ЗДЕСЬ НЕ УКАЗЫВАЕМ — он хранится в .Values.secrets.postgresPassword
    # ниже, чтобы не светиться в чартах с обычным config.
    db: "courses"
    # disable | require | verify-ca | verify-full
    sslmode: "disable"

  # ----- Kafka (живёт ВНЕ Kubernetes) -----
  # Если кафка не нужна — оставь brokers пустым массивом, сервис стартует без неё
  # (см. cmd/app/main.go: producer создаётся только когда брокеры указаны).
  kafka:
    brokers:
      - "host.docker.internal:9092"

# -----------------------------------------------------------------------------
# secrets — СЕКРЕТНЫЕ значения. Превращаются в Kubernetes Secret.
# !!! НЕ КОММИТЬ РЕАЛЬНЫЕ ПАРОЛИ В ЭТОТ ФАЙЛ !!!
# Реальные значения переопределяй через -f values-prod.yaml (вне git)
# или через --set secrets.postgresPassword=... .
# -----------------------------------------------------------------------------
secrets:
  postgresPassword: "postgres"

  # Если хочешь подключить к существующему секрету (созданному заранее
  # руками или внешним инструментом, например External Secrets / Vault),
  # укажи его имя. Тогда наш Secret чарт создавать не будет —
  # он будет ссылаться на этот существующий секрет.
  existingSecret: ""

# -----------------------------------------------------------------------------
# service — сетевой объект Kubernetes, через который другие сервисы
# (или Ingress) попадают в наши поды.
# -----------------------------------------------------------------------------
service:
  # Тип сервиса:
  #   ClusterIP    — доступен только внутри кластера. Самый безопасный, дефолт.
  #   NodePort     — открывает порт на каждом узле кластера, доступен снаружи
  #                   по <IP-узла>:<nodePort>. Удобно для учебного стенда.
  #   LoadBalancer — заказывает внешний LB у облачного провайдера (стоит денег).
  type: ClusterIP

  # Порт, который сервис показывает наружу (внутри кластера).
  # Должен совпадать с тем, что слушает приложение (config.httpServerAddr).
  port: 10001

  # nodePort активен только при type=NodePort. Диапазон 30000–32767.
  # Закомментирован, потому что по умолчанию k8s сам подбирает свободный порт.
  # nodePort: 30001

# -----------------------------------------------------------------------------
# ingress — публикация сервиса по HTTP-имени наружу кластера через Ingress
# Controller (например, nginx-ingress, traefik). Если в кластере нет
# ingress-controller'а — оставь enabled: false.
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  # className — имя IngressClass (например, "nginx", "traefik").
  className: "nginx"
  annotations: {}
    # nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: course-service.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: course-service-tls
  #   hosts:
  #     - course-service.local

# -----------------------------------------------------------------------------
# resources — лимиты и запросы на CPU/RAM.
# requests — k8s гарантирует, что выделит не меньше.
# limits   — k8s не даст превысить (CPU троттлит, RAM = OOMKill).
# Для маленького Go-сервиса достаточно скромных значений.
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m       # 50 миллиCPU = 0.05 ядра
    memory: 64Mi
  limits:
    cpu: 500m      # 0.5 ядра
    memory: 256Mi

# -----------------------------------------------------------------------------
# probes — проверки здоровья. Бьются по эндпоинту /health (см. server.go),
# который пингует Postgres и Kafka.
# -----------------------------------------------------------------------------
probes:
  # startupProbe — нужна, чтобы дать приложению время на старт (миграции БД,
  # подключение к kafka). Пока она не успешна — liveness/readiness не активны.
  startup:
    enabled: true
    failureThreshold: 30   # 30 попыток
    periodSeconds: 2       # каждые 2 секунды => до 60 секунд на старт

  # livenessProbe — k8s пересоздаёт под, если проба падает.
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # readinessProbe — k8s исключает под из Service, если проба падает
  # (трафик на него не идёт), но НЕ перезапускает.
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# -----------------------------------------------------------------------------
# securityContext — настройки безопасности контейнера.
# В Dockerfile мы создаём пользователя app:app и переключаемся на него,
# поэтому здесь явно говорим runAsNonRoot, чтобы k8s не дал случайно
# запустить от root, если кто-то соберёт образ иначе.
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # код пишет логи в /app/logs, корень не readonly
  capabilities:
    drop: ["ALL"]

# -----------------------------------------------------------------------------
# serviceAccount — собственный SA для пода.
# Полезно даже если не нужны RBAC-права: упрощает аудит и делает чарт чище.
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Параметры размещения подов.
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# Дополнительные переменные окружения (если нужно что-то быстро докинуть, не
# трогая шаблоны). Принимают стандартный k8s формат env: [{name, value}].
extraEnv: []
# - name: MY_FEATURE_FLAG
#   value: "true"
