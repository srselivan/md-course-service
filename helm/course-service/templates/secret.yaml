{{/*
=================================================================
Secret с содержимым .env файла.
-----------------------------------------------------------------
Приложение читает конфигурацию через github.com/joho/godotenv —
оно ОЖИДАЕТ файл .env в рабочей директории. Поэтому мы:
  1) собираем строку .env прямо здесь, в шаблоне;
  2) кладём её в Secret;
  3) монтируем Secret в Pod как файл /app/.env (см. deployment.yaml).

Почему Secret, а не ConfigMap? Потому что внутри есть пароль БД.
В k8s Secret и ConfigMap почти одинаковы технически, но Secret:
  - помечен как чувствительный (его сложнее посмотреть случайно);
  - значения хранятся в base64 (не шифрование, но базовая защита);
  - лучше дружит с инструментами секрет-менеджмента.

Если пользователь указал .Values.secrets.existingSecret — мы свой
секрет НЕ создаём, чтобы можно было управлять секретами снаружи
(External Secrets Operator, Vault, sealed-secrets и т.п.).
=================================================================
*/}}
{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "course-service.envSecretName" . }}
  labels:
    {{- include "course-service.labels" . | nindent 4 }}
type: Opaque
{{- /*
  Используем stringData (а не data): значения пишем в открытом виде,
  k8s сам закодирует их в base64 при сохранении.
*/}}
stringData:
  .env: |-
    LOG_LEVEL={{ .Values.config.logLevel }}
    LOG_FILE_PATH={{ .Values.config.logFilePath }}
    HTTP_SERVER_ADDR={{ .Values.config.httpServerAddr }}
    POSTGRES_HOST={{ .Values.config.postgres.host }}
    POSTGRES_PORT={{ .Values.config.postgres.port }}
    POSTGRES_USER={{ .Values.config.postgres.user }}
    POSTGRES_PASSWORD={{ .Values.secrets.postgresPassword }}
    POSTGRES_DB={{ .Values.config.postgres.db }}
    POSTGRES_SSLMODE={{ .Values.config.postgres.sslmode }}
    {{- if .Values.config.kafka.brokers }}
    KAFKA_BROKERS={{ join "," .Values.config.kafka.brokers }}
    {{- end }}
{{- end }}
